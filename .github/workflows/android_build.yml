name: Android App Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'MarauderController/**'
  pull_request:
    paths:
      - 'MarauderController/**'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Make gradlew executable
        run: chmod +x MarauderController/gradlew
        
      - name: Build Debug APK
        run: |
          cd MarauderController
          ./gradlew assembleDebug --no-daemon --stacktrace
          
      - name: Build Release APK
        run: |
          cd MarauderController
          ./gradlew assembleRelease --no-daemon --stacktrace
          
      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: marauder-controller-debug
          path: MarauderController/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v3
        with:
          name: marauder-controller-release
          path: MarauderController/app/build/outputs/apk/release/app-release-unsigned.apk
