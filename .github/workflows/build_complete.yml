name: Build Complete App & Firmware

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Arduino CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Build Firmware (LDDB Variant)
      working-directory: MarauderController
      run: |
        chmod +x build_firmware.sh
        ./build_firmware.sh

    - name: Grant execute permission for gradlew
      working-directory: MarauderController
      run: chmod +x gradlew

    - name: Build Release APK
      working-directory: MarauderController
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: MarauderController-Release
        path: MarauderController/app/build/outputs/apk/release/*.apk
    
    - name: Upload Firmware Binaries
      uses: actions/upload-artifact@v3
      with:
        name: MarauderFirmware-LDDB
        path: MarauderController/app/src/main/assets/firmware/*.bin
